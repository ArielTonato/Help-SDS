<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cifrado DES - Paso a Paso</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Cifrado DES - Visualización Paso a Paso</h1>
            <p>Explora cómo funciona el cifrado DES con una interfaz interactiva.</p>
        </div>

        <div class="main-content">
            <!-- Entrada de texto y clave -->
            <div class="section">
                <h2>📝 Entrada de Datos</h2>
                <div class="input-group">
                    <label for="textInput">Texto a cifrar:</label>
                    <input type="text" id="textInput" class="text-input" placeholder="Ingresa el texto...">
                </div>
                <div class="input-group">
                    <label for="keyInput">Clave (8 caracteres):</label>
                    <input type="text" id="keyInput" class="text-input" maxlength="8" placeholder="Ingresa la clave...">
                </div>
                <button type="button" id="startEncryption" class="size-btn">Iniciar Cifrado</button>
            </div>

            <!-- Proceso paso a paso -->
            <div class="section">
                <h2>🔄 Proceso de Cifrado</h2>
                <div id="encryptionSteps" class="steps-container">
                    <p>El proceso paso a paso aparecerá aquí...</p>
                </div>
            </div>

            <!-- Resultado final -->
            <div class="section">
                <h2>✅ Resultado Final</h2>
                <div class="output-group">
                    <label>Texto Cifrado:</label>
                    <div id="encryptedOutput" class="binary-output">El resultado aparecerá aquí...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/des_visualizer.js" type="module"></script>
</body>

</html>
